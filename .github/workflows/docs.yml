name: docs

# Separate from `test` on purpose: publish.yml keys its gate on `workflow_run: workflows: [test]`,
# so folding these steps into that workflow would put the docs in the release path.
on:
  push:
    branches: [main]
  pull_request:

# reads the repo and nothing else; the default token is write-scoped on a push to main
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # FIRST: the reference pages under docs/src/content/docs/api are generated from src/, and they
      # are gitignored, so a checker that runs before this one is reading a site with a fifth of its
      # pages missing. It reported a link into /api/ as broken for exactly that reason.
      - run: npm run docs-gen-reference
      # a twoslash block that stops compiling does NOT fail the astro build, it drops the whole page
      # body, so this is what keeps a blank page from deploying. It compiles the examples against the
      # PUBLISHED osra the docs workspace depends on, which makes it a drift gate too
      - run: npm run docs-check-twoslash
      - run: npm run docs-check-links
      - run: npm run docs-build
      - run: npm run docs-check-html
