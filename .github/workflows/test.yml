name: test

on:
  push:
    branches: [main]
  pull_request:

# reads the repo and nothing else; the default token is write-scoped on a push to main
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # vite-plus, its vite alias and the vitest override move together; reads the lockfile only
      - run: npm run test-toolchain
      - run: npx playwright install --with-deps chromium firefox webkit
      # build before type-check: examples/ import 'osra' via the package self-reference
      - run: npm run build
      # osra declares no dependencies, so a bare import in a shipped .d.ts is one the consumer cannot resolve
      - run: npm run check-declaration-imports
      - run: npm run type-check
      - run: npm run check-consumer-types
      # the same surface under an older TypeScript lib: shipped declarations must not name types
      # that only newer libs declare (Float16ArrayConstructor did, and took the Capable checks with it)
      - run: npm run check-consumer-types-legacy-lib
      # the compile error for a value that cannot cross is two lines, the second naming the bad field;
      # a union in the value parameter type adds a third and rejects union-typed values
      - run: npm run check-error-chain
      - run: npm test
      # the extension suite needs a headed browser with a display, so it is intentionally not part of CI

  # The same registry under node, on the two LTS lines users run. Node 22 and 24 lack the ES2026
  # Uint8Array base64 methods, so this is also where the JSON transport's fallback is exercised for real.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test-node
